<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TradeVision IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">TradeVision <span>IA</span></a>
    <a href="planos.html" class="text-link">Ver planos</a>
  </header>

  <main class="container centered">
    <section class="panel login-panel">
      <p class="eyebrow">Acesse sua conta</p>
      <h1>Login minimalista e seguro</h1>
      <p>Estrutura pronta para autenticação Firebase com Google (sem chave real neste projeto).</p>
      <button class="btn google-btn" id="googleLoginBtn" type="button">
        <span>G</span> Entrar com Google
      </button>
      <p class="helper-text" id="loginStatus">Conecte o Firebase para autenticação real.</p>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
